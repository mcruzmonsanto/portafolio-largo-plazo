name: CI/CD Portfolio Tracker

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov black flake8 mypy
      
      - name: Lint
        run: |
          black --check modules/
          flake8 modules/ --max-line-length=100 || true
      
      - name: Type Check
        run: mypy modules/ --ignore-missing-imports || true
      
      - name: Run Tests
        run: pytest tests/ -v --cov=modules --cov-report=xml || true
      
      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml

  integration:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Integration Test — Data Pipeline
        env:
          YFINANCE_TEST_MODE: "1"
        run: python -m pytest tests/integration/ -v || true
      
      - name: Generate Test Tear Sheet
        run: python scripts/generate_test_report.py || true
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-tear-sheet
          path: reports/test_tear_sheet.pdf
          if-no-files-found: ignore

  deploy:
    needs: [test, integration]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Streamlit Cloud
        uses: streamlit/streamlit-app-action@v1
        with:
          app-file: app.py
          requirements-file: requirements.txt
